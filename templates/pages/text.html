{% extends 'base.html' %}

{% block title %}Text{% endblock title %}

{% block content %}

<div class="page-header">
  <h1>{{ t('text.title') }}</h1>
  <p>{{ t('text.subtitle') }}</p>
</div>

<form onsubmit="return false;">
  {% for n in [1, 2, 3] %}
  <div class="card mb-3">
    <div class="card-body">
      <p class="section-label">{{ t('text.line_text', n=n) }}</p>
      <div class="d-flex align-items-center" style="gap:10px;">
        <input type="color" id="colorPicker{{ n if n > 1 else '' }}" value="#ff0000"
               title="{{ t('text.line_color', n=n) }}"
               style="width:44px;height:44px;padding:2px;border:none;border-radius:8px;cursor:pointer;flex-shrink:0;">
        <input name="text" id="textBox{{ n if n > 1 else '' }}" class="form-control"
               placeholder="{{ t('text.placeholder', n=n) }}" style="flex:1;">
        <button type="button" id="sendButton{{ n if n > 1 else '' }}"
                class="btn btn-primary" style="white-space:nowrap;height:44px;flex-shrink:0;">
          {{ t('text.send_btn', n=n) }}
        </button>
      </div>
    </div>
  </div>
  {% endfor %}
</form>

{% endblock content %}

{% block scripts %}
<script>
  function sendLine(line, textId, colorId) {
    const text = document.getElementById(textId).value;
    const userColor = document.getElementById(colorId).value;

    $.ajax({
      url: '/text2',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ text: text, color: userColor, line: line }),
      success: function() { showToast('Line ' + line + ' sent to matrix.'); },
      error: function()   { showToast('Failed to send text to matrix.', 'error'); }
    });
  }

  $('#sendButton').on('click',  () => sendLine(0, 'textBox',  'colorPicker'));
  $('#sendButton2').on('click', () => sendLine(1, 'textBox2', 'colorPicker2'));
  $('#sendButton3').on('click', () => sendLine(2, 'textBox3', 'colorPicker3'));
</script>
{% endblock scripts %}
